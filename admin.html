<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>myscanner • Admin</title>
  <meta name="theme-color" content="#0b0f1a" />
  <style>
    :root{
      --bg:#0b0f1a;--card:rgba(255,255,255,.06);--card2:rgba(255,255,255,.09);
      --b:rgba(255,255,255,.12);--t:rgba(255,255,255,.92);--m:rgba(255,255,255,.68);
      --ok:#37d67a;--bad:#ff4d4d;--w:#fff;--k:#111;--warn:#ffd166;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    header{position:sticky;top:0;z-index:50;background:rgba(11,15,26,.78);backdrop-filter:blur(10px);
      border-bottom:1px solid var(--b);padding:14px}
    .h{max-width:980px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between}
    .brand{display:flex;gap:10px;align-items:center;min-width:0}
    .logo{width:36px;height:36px;border-radius:14px;background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.04));border:1px solid var(--b)}
    h1{margin:0;font-size:22px;line-height:1.1}
    .sub{margin-top:2px;font-size:12px;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
    .wrap{max-width:980px;margin:0 auto;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
    .card{background:var(--card);border:1px solid var(--b);border-radius:18px;padding:14px;margin:12px 0}
    label{display:block;margin:10px 0 6px;font-size:12px;color:var(--m)}
    input,select{
      width:100%;border-radius:16px;border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.06);color:var(--t);padding:12px;font-size:16px;outline:none
    }
    input::placeholder{color:rgba(255,255,255,.38)}
    button{
      border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:var(--t);
      padding:12px 14px;border-radius:16px;font-size:16px;font-weight:800;cursor:pointer
    }
    button.primary{background:var(--w);color:var(--k)}
    button:disabled{opacity:.5;cursor:not-allowed}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media(max-width:820px){.row{grid-template-columns:1fr}.sub{max-width:50vw}}
    .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
    .grow{flex:1;min-width:160px}
    .msg{margin-top:10px;font-size:13px;color:var(--m);line-height:1.35}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;word-break:break-all;font-size:12px;color:var(--m)}
    .ok{color:var(--ok);font-weight:900}
    .bad{color:var(--bad);font-weight:900}
    .warn{color:var(--warn);font-weight:900}
    pre{background:var(--card2);border:1px solid var(--b);border-radius:16px;padding:12px;overflow:auto;margin:12px 0 0}
    .pill{display:inline-flex;align-items:center;gap:8px;padding:8px 10px;border-radius:999px;
      background:rgba(255,255,255,.10);border:1px solid var(--b);font-size:12px;color:var(--m)}
    .pill.ok{color:var(--ok)} .pill.bad{color:var(--bad)} .pill.warn{color:var(--warn)}
  </style>
</head>

<body>
<header>
  <div class="h">
    <div class="brand">
      <div class="logo"></div>
      <div style="min-width:0">
        <h1>myscanner</h1>
        <div class="sub">Admin • Προσθήκη πωλητών</div>
      </div>
    </div>
    <div id="pillServer" class="pill">server: …</div>
  </div>
</header>

<div class="wrap">

  <div class="card">
    <div class="msg">
      Αυτό το Admin μιλάει απευθείας με το Apps Script (JSONP). Αν δεις <span class="mono">unknown_action</span>,
      τότε το Web App που δείχνεις δεν έχει το action που ζητάς.
    </div>
    <div class="mono" id="apiLine"></div>
  </div>

  <div class="card">
    <label>Admin PIN</label>
    <input id="admin_pin" type="password" inputmode="numeric" placeholder="π.χ. 09586898" />

    <div class="row">
      <div>
        <label>Role</label>
        <select id="role">
          <option value="SELLER" selected>SELLER</option>
          <option value="TEST">TEST</option>
          <option value="ADMIN">ADMIN</option>
        </select>
      </div>
      <div>
        <label>PIN πωλητή (4–8 ψηφία/κωδικός)</label>
        <input id="pin" inputmode="numeric" placeholder="π.χ. 2468" />
      </div>
    </div>

    <div class="row">
      <div>
        <label>Όνομα</label>
        <input id="name" placeholder="π.χ. Γιάννης" />
      </div>
      <div>
        <label>Email</label>
        <input id="email" inputmode="email" placeholder="seller@company.com" />
      </div>
    </div>

    <div class="btnrow">
      <button id="btnSave" class="primary grow" type="button">Add Seller</button>
      <button id="btnClear" class="grow" type="button">Clear</button>
      <span id="status" class="msg" style="margin:0"></span>
    </div>

    <pre id="out" style="display:none"></pre>
  </div>

</div>

<script>
  // ✅ Το Apps Script URL που ζήτησες
  const API = "https://script.google.com/macros/s/AKfycbwaZmPMd2j0_ZUTC7VfhcPJvJLKioE_FotJg-_vl-_LIRelI9fBCeJqVz0-6Re9Y-fXdA/exec";

  function qs(id){ return document.getElementById(id); }

  function setPill(text, cls){
    const p = qs("pillServer");
    p.classList.remove("ok","bad","warn");
    if (cls) p.classList.add(cls);
    p.textContent = text;
  }

  function validateEmail(s){
    s = String(s||"").trim();
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);
  }

  // JSONP helper (Apps Script friendly)
  function jsonp(api, params){
    return new Promise((resolve, reject)=>{
      const cb = "cb_" + Math.random().toString(36).slice(2);
      params.callback = cb;

      const u = new URL(api);
      Object.entries(params).forEach(([k,v])=>u.searchParams.set(k, String(v)));

      const s = document.createElement("script");

      function cleanup(){
        try{ delete window[cb]; }catch(e){}
        if (s.parentNode) s.parentNode.removeChild(s);
      }

      window[cb] = (data)=>{ cleanup(); resolve(data); };
      s.onerror = ()=>{ cleanup(); reject(new Error("JSONP request failed")); };

      s.src = u.toString();
      document.body.appendChild(s);
    });
  }

  function resetForm(){
    qs("name").value = "";
    qs("email").value = "";
    qs("pin").value = "";
    qs("role").value = "SELLER";
    qs("status").textContent = "";
    qs("out").style.display = "none";
    qs("out").textContent = "";
    qs("name").focus();
  }

  // init
  (function init(){
    qs("apiLine").textContent = API;
    setPill("server: …", "");
    qs("name").focus();

    ["admin_pin","pin","email","name"].forEach(id=>{
      qs(id).addEventListener("keydown", (e)=>{
        if(e.key === "Enter") qs("btnSave").click();
      });
    });
  })();

  qs("btnClear").addEventListener("click", resetForm);

  qs("btnSave").addEventListener("click", async ()=>{
    qs("status").innerHTML = '<span class="warn">Στέλνω…</span>';
    qs("out").style.display = "none";
    qs("out").textContent = "";
    qs("btnSave").disabled = true;

    try{
      const admin_pin = qs("admin_pin").value.trim();
      const name = qs("name").value.trim();
      const email = qs("email").value.trim();
      const pin = qs("pin").value.trim();
      const role = qs("role").value.trim();

      if(!admin_pin) throw new Error("Λείπει Admin PIN.");
      if(!name) throw new Error("Λείπει όνομα.");
      if(!email || !validateEmail(email)) throw new Error("Λάθος email.");
      if(!pin || pin.length < 4) throw new Error("PIN πωλητή: βάλε τουλάχιστον 4 χαρακτήρες.");

      const payload = { action:"admin_add_seller", admin_pin, name, email, pin, role };

      const res = await jsonp(API, payload);

      qs("out").style.display = "block";
      qs("out").textContent = JSON.stringify(res, null, 2);

      if(res && res.ok){
        setPill("server: online", "ok");
        qs("status").innerHTML = '<span class="ok">OK • Προστέθηκε</span>';
        // καθάρισμα (κρατάμε admin pin)
        qs("name").value = "";
        qs("email").value = "";
        qs("pin").value = "";
        qs("role").value = "SELLER";
        qs("name").focus();
      }else{
        setPill("server: online", "ok");
        qs("status").innerHTML = '<span class="bad">ERROR • Δες το output</span>';
      }

    }catch(e){
      setPill(navigator.onLine ? "server: error" : "server: offline", "bad");
      qs("status").innerHTML = '<span class="bad">'+(e.message||e)+'</span>';
    }finally{
      qs("btnSave").disabled = false;
    }
  });
</script>
</body>
</html>
