{% extends "base.html" %}

{% block content %}

<div class="auth-wrapper">
    <div class="card auth-card">
        <h1>Σύνδεση</h1>
        <p class="muted">Μπες στο PhotoMatch admin περιβάλλον.</p>

        {% if error %}
        <div class="alert">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/login" class="form">
            <label>Email</label>
            <input type="email" name="email" placeholder="admin@photomatch.local" required>

            <label>Κωδικός</label>
            <input type="password" name="password" placeholder="••••••••" required>

            <button type="submit">Σύνδεση</button>
        </form>

        <div class="demo-info">
            <strong>Demo admin:</strong><br>
            admin@photomatch.local<br>
            admin123
        </div>
    </div>
</div>

{% endblock %}
