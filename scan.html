<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>myscanner • Scan</title>
<meta name="theme-color" content="#0b0f1a">
<style>
:root{--bg:#0b0f1a;--card:rgba(255,255,255,.06);--card2:rgba(255,255,255,.09);--b:rgba(255,255,255,.12);--t:rgba(255,255,255,.92);--m:rgba(255,255,255,.68);--ok:#37d67a;--bad:#ff4d4d;--w:#fff;--k:#111}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:50;background:rgba(11,15,26,.78);backdrop-filter:blur(10px);border-bottom:1px solid var(--b);padding:14px}
.h{max-width:980px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.logo{width:36px;height:36px;border-radius:14px;background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.04));border:1px solid var(--b)}
h1{margin:0;font-size:22px;line-height:1.1}
.sub{margin-top:2px;font-size:12px;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
.pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{padding:8px 10px;border-radius:999px;background:rgba(255,255,255,.10);border:1px solid var(--b);font-size:12px;color:var(--m);white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.bad{color:var(--bad)}
.wrap{max-width:980px;margin:0 auto;padding:14px 14px calc(84px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--b);border-radius:18px;padding:14px;margin:12px 0}
.row{display:flex;gap:12px;flex-wrap:wrap}
.col{flex:1;min-width:280px}
label{display:block;margin:10px 0 6px;font-size:12px;color:var(--m)}
input,select{width:100%;border-radius:16px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--t);padding:12px;font-size:16px;outline:none}
input:disabled{opacity:.7}
button{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:var(--t);padding:12px 14px;border-radius:16px;font-size:16px;font-weight:800}
button.primary{background:var(--w);color:var(--k)}
button:disabled{opacity:.5}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.grow{flex:1;min-width:160px}
video{width:100%;max-height:360px;border-radius:18px;background:#000}
.msg{margin-top:10px;font-size:13px;color:var(--m);line-height:1.35}
.msg .ok{color:var(--ok);font-weight:800} .msg .bad{color:var(--bad);font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}.sub{max-width:50vw}}
.quick{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.quick button{padding:10px 12px;font-size:14px;border-radius:14px}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(11,15,26,.82);border-top:1px solid var(--b);backdrop-filter:blur(10px);z-index:60}
.nav{max-width:980px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.tab{border-radius:16px;padding:12px 10px;font-weight:900;text-align:center}
.tab.active{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.28)}
.list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.item{border:1px solid var(--b);border-radius:16px;background:var(--card2);padding:12px}
.item b{display:block;font-size:15px;margin-bottom:4px}
.small{font-size:12px;color:var(--m);line-height:1.35}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;word-break:break-all;font-size:12px;color:var(--m)}
</style>
</head>
<body>
<header>
  <div class="h">
    <div class="brand">
      <div class="logo"></div>
      <div style="min-width:0">
        <h1>myscanner</h1>
        <div id="storeLine" class="sub">…</div>
      </div>
    </div>
    <div class="pills">
      <div id="pillOnline" class="pill">server: …</div>
      <div id="pillCam" class="pill">camera: off</div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="card">
    <div class="small">Myscanner</div>
    <div class="mono">Scan</div>
  </div>

  <section id="paneScan">
    <div class="card">
      <div class="row">
        <div class="col">
          <div class="btnrow">
            <button id="btnStart" class="primary grow" type="button">Start camera</button>
            <button id="btnStop" class="grow" type="button" disabled>Stop</button>
          </div>
          <div class="msg">Μόλις βρει barcode, γεμίζει <b>αυτόματα</b> το πεδίο και κάνει lookup.</div>
          <div style="margin-top:12px"><video id="video" playsinline muted></video></div>
          <div id="camStatus" class="msg"></div>
        </div>

        <div class="col">
          <label>Barcode</label>
          <div class="btnrow">
            <input id="barcode" class="grow" placeholder="σκάναρε ή γράψε" inputmode="numeric">
            <button id="btnLookup" type="button">Lookup</button>
            <button id="btnClear" type="button">Clear</button>
          </div>

          <label>Internal code</label>
          <input id="internal_code" placeholder="(από κατάλογο)">

          <label>Περιγραφή</label>
          <input id="product_name" placeholder="(από κατάλογο ή χειροκίνητα)">

          <div class="grid2">
            <div><label>Κατηγορία</label><input id="category" placeholder="(από κατάλογο)"></div>
            <div><label>Μονάδα</label><input id="unit" placeholder="π.χ. τεμ / κιλό"></div>
          </div>

          <div class="grid2">
            <div><label>Τιμή καταλόγου</label><input id="master_price" disabled placeholder="(από κατάλογο)"></div>
            <div><label>Τιμή (αλλάζει)</label><input id="price" placeholder="π.χ. 2.50" inputmode="decimal"></div>
          </div>

          <div class="quick">
            <button id="btnMaster" type="button">Ίδια με master</button>
            <button data-add="0.10" type="button">+0.10</button>
            <button data-add="0.50" type="button">+0.50</button>
            <button data-add="1.00" type="button">+1.00</button>
          </div>

          <div class="grid2">
            <div>
              <label>ΦΠΑ</label>
              <select id="vat">
                <option value="24%">24%</option>
                <option value="13%" selected>13%</option>
                <option value="6%">6%</option>
                <option value="0%">0%</option>
              </select>
            </div>
            <div style="display:flex;align-items:end">
              <button id="btnSave" class="primary" type="button" style="width:100%">Save</button>
            </div>
          </div>

          <div id="formStatus" class="msg"></div>
        </div>
      </div>
    </div>
  </section>

  <section id="paneSearch" style="display:none">
    <div class="card">
      <label>Λεκτική αναζήτηση (όνομα / barcode / internal code)</label>
      <div class="btnrow">
        <input id="q" class="grow" placeholder="π.χ. coca, 520..., κωδικός">
        <button id="btnSearch" class="primary" type="button">Search</button>
      </div>

      <div class="msg">Φίλτρο τύπου καταστήματος (auto από το κατάστημα — αλλά μπορείς να το αλλάξεις):</div>
      <div id="typeChips" class="quick"></div>

      <div id="results" class="list"></div>
    </div>
  </section>

  <section id="paneRecent" style="display:none">
    <div class="card">
      <div class="small">Πρόσφατα (τοπικά στο κινητό)</div>
      <div id="recent" class="list"></div>
    </div>
  </section>
</div>

<nav class="bottom">
  <div class="nav">
    <button id="tabScan" class="tab active" type="button">Scan</button>
    <button id="tabSearch" class="tab" type="button">Αναζήτηση</button>
    <button id="tabRecent" class="tab" type="button">Recent</button>
  </div>
</nav>

<script>
const API="https://script.google.com/macros/s/AKfycbxkPaNhUE-b8cYO3xFnRIh1A0MBsONaX-9PFcPjiVlSBk3hvyxPmK5G1f6_8v7ZWATeRg/exec";
const qs=(id)=>document.getElementById(id);

const u=new URL(location.href);
const store_id=u.searchParams.get("store_id")||"";
const token=u.searchParams.get("token")||"";
const RECENT_KEY="myscanner_recent_"+store_id;

/* ===================== Store Type Filters ===================== */
const TYPES = [
  {id:"MARKET",     label:"ΜΑΡΚΕΤ"},
  {id:"KREOPOLEIO", label:"ΚΡΕΟΠΩΛΕΙΟ"},
  {id:"MANAVIKO",   label:"ΜΑΝΑΒΙΚΟ"},
  {id:"FARMAKEIO",  label:"ΦΑΡΜΑΚΕΙΟ"},
  {id:"PETSHOP",    label:"PET SHOP"},
];
const TYPES_KEY = "myscanner_types_"+store_id;
let selectedTypes = [];

function normType(s){ return String(s||"").toUpperCase().replace(/[^A-Z0-9]+/g,""); }

function loadTypes(){
  try{ selectedTypes = JSON.parse(localStorage.getItem(TYPES_KEY)||"[]"); }
  catch(e){ selectedTypes=[]; }
  if(!Array.isArray(selectedTypes)) selectedTypes=[];
  selectedTypes = selectedTypes.map(x=>normType(x)).filter(Boolean);
}

function saveTypes(){ try{ localStorage.setItem(TYPES_KEY, JSON.stringify(selectedTypes)); }catch(e){} }

function renderTypeChips(){
  const box = qs("typeChips");
  if(!box) return;

  box.innerHTML = TYPES.map(t=>{
    const on = selectedTypes.includes(t.id);
    return `<button type="button" data-t="${t.id}" class="${on?'primary':''}">${t.label}</button>`;
  }).join("");

  box.querySelectorAll("button[data-t]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = normType(btn.getAttribute("data-t"));
      if(!id) return;

      if(selectedTypes.includes(id)) selectedTypes = selectedTypes.filter(x=>x!==id);
      else selectedTypes.push(id);

      saveTypes();
      renderTypeChips();

      const q = (qs("q").value||"").trim();
      if(q.length>=2) doSearch(true);
    });
  });
}
/* ============================================================= */

function setPill(el,text,cls){
  el.classList.remove("ok","bad");
  if(cls) el.classList.add(cls);
  el.textContent=text;
}

function jsonp(api,params){
  return new Promise((resolve,reject)=>{
    const cb="cb_"+Math.random().toString(36).slice(2);
    params.callback=cb;
    const url=new URL(api);
    Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
    const s=document.createElement("script");
    const cleanup=()=>{ try{delete window[cb]}catch(e){} if(s.parentNode)s.parentNode.removeChild(s); };
    window[cb]=(data)=>{ setPill(qs("pillOnline"),"server: online","ok"); cleanup(); resolve(data); };
    s.onerror=()=>{ setPill(qs("pillOnline"),"server: offline","bad"); cleanup(); reject(new Error("jsonp")); };
    s.src=url.toString();
    document.body.appendChild(s);
  });
}

function setMsg(id,html){ qs(id).innerHTML=html; }
function safe(v){ return (v??"")==="" ? "" : String(v); }
function fillFromProduct(p){
  qs("barcode").value=safe(p.barcode)||qs("barcode").value;
  qs("internal_code").value=safe(p.internal_code);
  qs("product_name").value=safe(p.product_name);
  qs("category").value=safe(p.category);
  qs("unit").value=safe(p.unit);
  qs("master_price").value=(p.price??"")==="" ? "" : String(p.price);
}

let storeTypeFromServer="";

async function storeInfo(){
  if(!store_id||!token){
    qs("storeLine").innerHTML='<span class="bad">Μη έγκυρο link (λείπει store_id/token).</span>';
    return;
  }
  try{
    const res=await jsonp(API,{action:"store_info",store_id,token});
    if(res.ok){
      storeTypeFromServer = normType(res.store_type||"");
      qs("storeLine").textContent = `Κατάστημα: ${res.store_name} • ${store_id}` + (storeTypeFromServer ? ` • ${storeTypeFromServer}`:"");

      // ✅ Auto default filter: αν δεν έχεις ήδη αποθηκευμένη επιλογή, βάλε το store_type
      if(!selectedTypes.length && storeTypeFromServer){
        selectedTypes = [storeTypeFromServer];
        saveTypes();
      }
      renderTypeChips();
    }else{
      qs("storeLine").textContent="Μη έγκυρο link.";
    }
  }catch(e){
    qs("storeLine").innerHTML='<span class="bad">Δεν επικοινωνεί με server.</span>';
  }
}

let lookupTimer=null;
let isNewProduct=false;

function scheduleLookup(){ clearTimeout(lookupTimer); lookupTimer=setTimeout(()=>lookup(),220); }

async function lookup(){
  const barcode = qs("barcode").value.trim();
  if(!barcode || barcode === "0") return;

  setMsg("formStatus",'<span class="small">Lookup…</span>');
  try{
    const res = await jsonp(API,{action:"store_lookup",store_id,token,barcode});

    if(res.ok){
      isNewProduct = false;
      fillFromProduct(res.product||{barcode});
      setMsg("formStatus",'<span class="ok">Βρέθηκε στον κατάλογο ✔</span>');
      return;
    }

    const err = String(res.error||res.message||"").toLowerCase();
    if(err.includes("not_found")){
      isNewProduct = true;
      qs("internal_code").value="";
      qs("product_name").value="";
      qs("category").value="";
      qs("unit").value="";
      qs("master_price").value="";
      setMsg("formStatus",'<span class="bad">Δεν υπάρχει στον κατάλογο → συμπλήρωσε στοιχεία και πάτα Save (θα προστεθεί).</span>');
      qs("product_name").focus();
      return;
    }

    isNewProduct = false;
    setMsg("formStatus",`<span class="bad">Σφάλμα: ${res.error||"lookup_failed"}</span>`);
  }catch(e){
    setMsg("formStatus",'<span class="bad">Server error</span>');
  }
}

function beep(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type="sine"; o.frequency.value=880;
    g.gain.setValueAtTime(0.001,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25,ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.12);
    o.start(); o.stop(ctx.currentTime+0.14);
    setTimeout(()=>ctx.close(),200);
  }catch(e){}
}

function addRecent(entry){
  try{
    const cur=JSON.parse(localStorage.getItem(RECENT_KEY)||"[]");
    cur.unshift(entry);
    localStorage.setItem(RECENT_KEY, JSON.stringify(cur.slice(0,30)));
  }catch(e){}
  renderRecent();
}

function renderRecent(){
  const box=qs("recent");
  let cur=[];
  try{ cur=JSON.parse(localStorage.getItem(RECENT_KEY)||"[]"); }catch(e){}
  if(!cur.length){ box.innerHTML='<div class="small">Δεν έχεις πρόσφατα ακόμα.</div>'; return; }
  box.innerHTML=cur.map(it=>`
    <div class="item">
      <b>${it.product_name||"(χωρίς όνομα)"}</b>
      <div class="small">barcode: ${it.barcode||""} • τιμή: ${it.price||""} • ΦΠΑ: ${it.vat||""}</div>
      <div class="btnrow"><button class="grow" type="button" data-b="${it.barcode||""}">Ξαναφόρτωσε</button></div>
    </div>`).join("");
  box.querySelectorAll("button[data-b]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      qs("barcode").value=btn.getAttribute("data-b")||"";
      activateTab("scan");
      lookup();
    });
  });
}

// ===== Background Save Queue =====
const PENDING_KEY = "myscanner_pending_"+store_id;

function pushPending_(payload){
  try{
    const cur = JSON.parse(localStorage.getItem(PENDING_KEY)||"[]");
    cur.push(payload);
    localStorage.setItem(PENDING_KEY, JSON.stringify(cur));
  }catch(e){}
}
function popPending_(){
  try{
    const cur = JSON.parse(localStorage.getItem(PENDING_KEY)||"[]");
    const item = cur.shift();
    localStorage.setItem(PENDING_KEY, JSON.stringify(cur));
    return item;
  }catch(e){ return null; }
}
function pendingCount_(){
  try{ return (JSON.parse(localStorage.getItem(PENDING_KEY)||"[]")).length; }
  catch(e){ return 0; }
}
async function flushPending_(){
  if(!navigator.onLine) return;
  let item;
  while((item = popPending_())){
    try{
      const res = await jsonp(API, item);
      if(!res || !res.ok){ pushPending_(item); break; }
    }catch(e){ pushPending_(item); break; }
  }
}
window.addEventListener("online", flushPending_);

async function save(){
  let barcode = qs("barcode").value.trim();
  const price = qs("price").value.trim();

  const internalCode = qs("internal_code").value.trim();
  const productName  = qs("product_name").value.trim();

  if(!barcode) barcode = "0";

  // ✅ αν barcode=0, θέλει τουλάχιστον περιγραφή ή internal code
  if (barcode === "0" && !internalCode && !productName) {
    alert("Βάλε τουλάχιστον Περιγραφή ή Internal code.");
    return;
  }

  if(!price || Number(price) <= 0){
    setMsg("formStatus",'<span class="bad">Βάλε τιμή &gt; 0.</span>');
    return;
  }

  if(isNewProduct && barcode !== "0" && !productName){
    setMsg("formStatus",'<span class="bad">Βάλε περιγραφή προϊόντος (είναι νέο στον κατάλογο).</span>');
    qs("product_name").focus();
    return;
  }

  const payload = {
    action: "store_scan",
    store_id,
    token,
    barcode,
    internal_code: internalCode,
    product_name: productName,
    category: qs("category").value.trim(),
    unit: qs("unit").value.trim(),
    price,
    vat: qs("vat").value,
    add_to_catalog: (isNewProduct && barcode !== "0") ? "1" : "0"
  };

  setMsg("formStatus", `<span class="small">Στάλθηκε… (queue: ${pendingCount_()})</span>`);
  addRecent({barcode, product_name: payload.product_name, price, vat: payload.vat, at: Date.now(), status: "pending"});

  qs("price").value = "";
  qs("barcode").value = "";
  qs("barcode").focus();
  isNewProduct = false;

  if(!navigator.onLine){
    pushPending_(payload);
    setMsg("formStatus", `<span class="bad">Offline: αποθηκεύτηκε τοπικά (queue: ${pendingCount_()})</span>`);
    return;
  }

  jsonp(API, payload).then(res=>{
    if(res && res.ok){
      setMsg("formStatus", `<span class="ok">Αποθηκεύτηκε ✔</span>`);
      if(navigator.vibrate) navigator.vibrate([40,30,40]);
      beep();
    }else{
      pushPending_(payload);
      setMsg("formStatus", `<span class="bad">Δεν σώθηκε στον server (queue: ${pendingCount_()})</span>`);
    }
  }).catch(_=>{
    pushPending_(payload);
    setMsg("formStatus", `<span class="bad">Δίκτυο: μπήκε σε queue (${pendingCount_()})</span>`);
  });
}

// ===== Search =====
let searchTimer=null;

async function doSearch(force=false){
  const q=qs("q").value.trim();
  if(q.length<2){ qs("results").innerHTML=""; return; }
  if(!force){ clearTimeout(searchTimer); searchTimer=setTimeout(()=>doSearch(true),280); return; }

  qs("results").innerHTML='<div class="small">Searching…</div>';

  try{
    // ✅ Αν ο χρήστης δεν έχει επιλέξει τίποτα, στέλνουμε κενό.
    // Server θα βάλει auto το store_type του καταστήματος.
    const typesParam = selectedTypes.join(",");
    const res=await jsonp(API,{action:"store_search",store_id,token,q, types: typesParam});

    const items=res.items||[];
    if(!items.length){ qs("results").innerHTML='<div class="small">Δεν βρέθηκε κάτι.</div>'; return; }

    qs("results").innerHTML=items.map(it=>`
      <div class="item">
        <b>${it.product_name||"(χωρίς όνομα)"}</b>
        <div class="small">
          barcode: ${it.barcode||""} • internal: ${it.internal_code||""} • ${it.category||""} • ${it.unit||""} • τιμή: ${(it.price??"")}
        </div>
        <div class="btnrow">
          <button class="grow" type="button"
            data-b="${it.barcode||""}"
            data-ic="${it.internal_code||""}"
            data-name="${(it.product_name||"").replace(/"/g,'&quot;')}"
            data-cat="${(it.category||"").replace(/"/g,'&quot;')}"
            data-unit="${it.unit||""}"
            data-price="${(it.price??"")}"
          >Επιλογή</button>
        </div>
      </div>`).join("");

    qs("results").querySelectorAll("button").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const b  = btn.getAttribute("data-b") || "";
        const ic = btn.getAttribute("data-ic") || "";
        const nm = btn.getAttribute("data-name") || "";
        const ct = btn.getAttribute("data-cat") || "";
        const un = btn.getAttribute("data-unit") || "";
        const pr = btn.getAttribute("data-price") || "";

        qs("barcode").value = b;
        qs("internal_code").value = ic;
        qs("product_name").value = nm;
        qs("category").value = ct;
        qs("unit").value = un;
        qs("master_price").value = pr;

        isNewProduct = false;
        activateTab("scan");
        if (b) lookup();
        else qs("price").focus();
      });
    });

  }catch(e){
    qs("results").innerHTML='<div class="bad">Server error</div>';
  }
}

// ===== Camera =====
let stream=null, scanning=false, detector=null;
let lastDetected="", lastAt=0;

async function startCam(){
  if(location.protocol!=="https:" && location.hostname!=="localhost"){
    qs("camStatus").innerHTML='<span class="bad">Χρειάζεται HTTPS για κάμερα.</span>';
    setPill(qs("pillCam"),"camera: https","bad");
    return;
  }
  if(!("mediaDevices" in navigator) || !navigator.mediaDevices.getUserMedia){
    qs("camStatus").innerHTML='<span class="bad">Δεν υποστηρίζει κάμερα.</span>';
    setPill(qs("pillCam"),"camera: unsupported","bad");
    return;
  }
  if(!("BarcodeDetector" in window)){
    qs("camStatus").innerHTML='<span class="bad">Θέλει Chrome/Android (BarcodeDetector).</span>';
    setPill(qs("pillCam"),"camera: no-detector","bad");
    return;
  }

  detector=new BarcodeDetector({formats:["ean_13","ean_8","code_128","upc_a","upc_e"]});

  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    const v=qs("video");
    v.srcObject=stream;
    await v.play();
    scanning=true;

    qs("btnStart").disabled=true;
    qs("btnStop").disabled=false;

    setPill(qs("pillCam"),"camera: on","ok");
    qs("camStatus").innerHTML='<span class="ok">Κάμερα ενεργή. Σκάναρε barcode.</span>';
    tick();
  }catch(e){
    qs("camStatus").innerHTML='<span class="bad">Δεν δόθηκε άδεια κάμερας.</span>';
    setPill(qs("pillCam"),"camera: blocked","bad");
  }
}

async function tick(){
  if(!scanning) return;
  try{
    const v=qs("video");
    const barcodes=await detector.detect(v);
    if(barcodes && barcodes.length){
      const code=barcodes[0].rawValue||"";
      const t=Date.now();
      if(code && (code!==lastDetected || (t-lastAt)>2200)){
        lastDetected=code; lastAt=t;
        qs("barcode").value=code;
        scheduleLookup();
        if(navigator.vibrate) navigator.vibrate(20);
      }
    }
  }catch(e){}
  requestAnimationFrame(tick);
}

function stopCam(){
  scanning=false;
  qs("btnStart").disabled=false;
  qs("btnStop").disabled=true;
  try{ if(stream) stream.getTracks().forEach(t=>t.stop()); }catch(e){}
  stream=null;
  qs("video").srcObject=null;
  setPill(qs("pillCam"),"camera: off","");
  qs("camStatus").textContent="";
}

function activateTab(tab){
  const tabs={scan:"tabScan",search:"tabSearch",recent:"tabRecent"};
  ["scan","search","recent"].forEach(k=>qs(tabs[k]).classList.toggle("active",k===tab));
  qs("paneScan").style.display=(tab==="scan")?"":"none";
  qs("paneSearch").style.display=(tab==="search")?"":"none";
  qs("paneRecent").style.display=(tab==="recent")?"":"none";
  if(tab==="recent") renderRecent();
}

// wiring
qs("btnLookup").addEventListener("click",lookup);
qs("barcode").addEventListener("input",()=>{
  const b=qs("barcode").value.trim();
  if(b.length>=8) scheduleLookup();
});

qs("btnClear").addEventListener("click",()=>{
  ["barcode","internal_code","product_name","category","unit","master_price","price"].forEach(id=>qs(id).value="");
  setMsg("formStatus","");
  lastDetected="";
  isNewProduct=false;
  qs("barcode").focus();
});

qs("btnSave").addEventListener("click",save);
qs("btnStart").addEventListener("click",startCam);
qs("btnStop").addEventListener("click",stopCam);

qs("btnSearch").addEventListener("click",()=>doSearch(true));
qs("q").addEventListener("input",()=>doSearch(false));

qs("tabScan").addEventListener("click",()=>activateTab("scan"));
qs("tabSearch").addEventListener("click",()=>activateTab("search"));
qs("tabRecent").addEventListener("click",()=>activateTab("recent"));

qs("btnMaster").addEventListener("click",()=>{
  const mp=qs("master_price").value.trim();
  if(mp) qs("price").value=mp;
  qs("price").focus();
});

document.querySelectorAll("button[data-add]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    const add=Number(btn.getAttribute("data-add")||0);
    const cur=Number(qs("price").value || qs("master_price").value || 0);
    const v=Math.max(0,cur+add);
    qs("price").value=v ? v.toFixed(2) : "";
    qs("price").focus();
  });
});

// init
setPill(qs("pillOnline"),"server: …","");
loadTypes();
renderTypeChips();
storeInfo();
renderRecent();
if(navigator.onLine) flushPending_();
</script>
</body>
</html>
